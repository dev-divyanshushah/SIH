version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./persist_air.db
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost,http://localhost:5173
      - ML_SERVICE_URL=http://ml-service:8001
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
